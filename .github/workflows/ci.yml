---

name: ci
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true
      - name: install
        run: pnpm i --frozen-lockfile
      - name: build
        run: pnpm run build
      - name: test
        run: pnpm test
      - name: install browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e
        run: pnpm e2e
      - id: hosting-channel
        env:
          github_ref: ${{ github.ref }}
        run: |
          case "$github_ref" in
          'refs/heads/main')
            echo 'channel=live' >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo 'channel=' >> "$GITHUB_OUTPUT"
            ;;
          esac
      - name: deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AEREAL_ORG }}'
          channelId: ${{ steps.hosting-channel.outputs.channel }}
          projectId: aereal-org
