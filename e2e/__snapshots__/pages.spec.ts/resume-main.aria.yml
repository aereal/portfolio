    - text: の開発チームに所属。
  - paragraph: "2017年8月からテックリードとして、ミドルウェアのアップデート戦略やシステムのリアーキテクチャリングの提案と遂行など 中長期的な視野に立ったエンジニアリングの牽引を務める。"
  - heading "課金システムのAWS移設およびコンテナワークロードへの移行" [level=5]
  - time: "2019年12月"
  - text: 〜
  - time: "2020年1月"
  - paragraph: 立ち上げに携わった課金システムをオンプレミスからAWSに移設した。
  - paragraph: また、コンテナワークロード (AWS ECS) へ移行した。
